<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengelolaan Inventaris Posko - Admin Posko UMY</title>

  <!-- Google Fonts, Bootstrap 5.3 & SweetAlert2 CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <!-- Guard: Khusus Admin Posko -->
  <script src="../js/auth.js"></script>
  <script>requireAuth(true);</script>
</head>

<body class="bg-light">

  <!-- HEADER & SIDEBAR UMY KRS STYLE -->
  <div id="navbar-container"></div>

  <!-- KONTEN UTAMA INVENTARIS -->
  <main class="umy-main-content">
    <div class="container-fluid">

      <!-- HEADER ACTION BAR -->
      <div class="card bg-success text-white p-4 rounded-4 shadow-sm mb-4 border-0">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
          <div>
            <span class="badge bg-white bg-opacity-25 rounded-pill px-3 py-1.5 mb-2">
              <i class="bi bi-box-seam me-1"></i> Logistik Fisik Posko Keamanan
            </span>
            <h3 class="fw-bold mb-1">Pengelolaan Inventaris Barang Temuan</h3>
            <p class="text-white opacity-90 small mb-0">Catat barang temuan baru, atur rak/posko penyimpanan, perbarui
              status klaim, atau hapus data inventaris.</p>
          </div>
          <div class="d-flex gap-2">
            <button onclick="openCreateFoundItemModal()"
              class="btn btn-light btn-sm rounded-pill px-3.5 py-2 fw-semibold shadow-xs">
              <i class="bi bi-plus-circle me-1 text-success"></i>Catat Temuan Baru
            </button>
          </div>
        </div>
      </div>

      <!-- FILTER & SEARCH BAR -->
      <div class="card p-3 border-0 shadow-sm rounded-4 bg-white mb-4">
        <div class="row g-2 align-items-center">
          <div class="col-md-5">
            <input type="text" id="inv-search" class="form-control"
              placeholder="🔍 Cari nama barang, ciri khusus, nomor ID..." oninput="filterAndRenderInventory()">
          </div>
          <div class="col-md-4">
            <select id="inv-storage-filter" class="form-select" onchange="filterAndRenderInventory()">
              <option value="ALL">Semua Titik Simpan Posko</option>
              <option value="Posko Keamanan Pusat (Gerbang Utama)">Posko Keamanan Pusat (Gerbang Utama)</option>
              <option value="Pos Satpam Gedung AR. Fachruddin A">Pos Satpam Gedung AR. Fachruddin A</option>
              <option value="Pos Satpam Gedung AR. Fachruddin B">Pos Satpam Gedung AR. Fachruddin B</option>
              <option value="Pos Satpam Gedung Siti Walidah">Pos Satpam Gedung Siti Walidah</option>
              <option value="Pos Satpam Gedung Ibrahim (FTI)">Pos Satpam Gedung Ibrahim (FTI)</option>
              <option value="Pos Satpam Gedung Mas Mansyur">Pos Satpam Gedung Mas Mansyur</option>
              <option value="Brankas Barang Berharga (Posko Pusat)">Brankas Barang Berharga (Posko Pusat)</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="inv-status-filter" class="form-select" onchange="filterAndRenderInventory()">
              <option value="ALL">Semua Status</option>
              <option value="stored">Tersimpan di Posko</option>
              <option value="matched">Matched (Menunggu Diambil)</option>
              <option value="returned">Sudah Diserahkan (Returned)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- GRID INVENTARIS BARANG -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold mb-0 text-dark">
          <i class="bi bi-boxes text-success me-1"></i> Daftar Barang Fisik di Posko (<span id="inv-count">0</span>)
        </h6>
        <button onclick="loadInventoryData()" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>

      <div class="row g-3" id="inventory-list">
        <div class="col-12 text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm text-success"></div> Memuat inventaris barang fisik...
        </div>
      </div>
    </div>
  </main>

  <div id="telegram-modal-container"></div>

  <!-- Scripts JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    let allInventory = [];

    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('admin-inventory');
      loadInventoryData();
    });

    async function loadInventoryData() {
      try {
        const res = await api.getFoundItems();
        allInventory = res?.data || [];
        filterAndRenderInventory();
      } catch (err) {
        console.error('Error loadInventory:', err);
      }
    }

    function filterAndRenderInventory() {
      const search = (document.getElementById('inv-search')?.value || '').toLowerCase();
      const storage = document.getElementById('inv-storage-filter')?.value || 'ALL';
      const status = document.getElementById('inv-status-filter')?.value || 'ALL';
      const grid = document.getElementById('inventory-list');

      const filtered = allInventory.filter(item => {
        const matchSearch = (item.id || '').toLowerCase().includes(search) ||
          (item.title || '').toLowerCase().includes(search) ||
          (item.features || '').toLowerCase().includes(search) ||
          (item.foundBy || '').toLowerCase().includes(search);
        const matchStorage = storage === 'ALL' || item.storageLocation === storage;
        const matchStatus = status === 'ALL' || item.status === status;
        return matchSearch && matchStorage && matchStatus;
      });

      document.getElementById('inv-count').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">Tidak ada barang temuan yang sesuai filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden bg-white card-custom">
            <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600'}" alt="${item.title}" style="height: 175px; object-fit: cover;">
            <div class="card-body p-3.5 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge bg-light text-dark font-monospace border px-2 py-1">${item.id}</span>
                  <span class="badge ${item.status === 'returned' ? 'bg-secondary' : item.status === 'matched' ? 'bg-warning text-dark' : 'bg-success'} rounded-pill px-2.5 py-1">
                    ${item.status === 'returned' ? 'Sudah Diambil' : item.status === 'matched' ? 'Matched (Klaim)' : 'Tersimpan di Posko'}
                  </span>
                </div>
                <h6 class="fw-bold mb-1 text-dark fs-6">${item.title}</h6>
                <div class="badge bg-primary-subtle text-primary rounded-pill mb-2" style="font-size: 0.7rem;">${item.category}</div>
                <p class="text-muted small fst-italic mb-3 line-clamp-2">"${item.features}"</p>
              </div>

              <div class="border-top pt-2.5 small">
                <div class="text-danger fw-semibold mb-1"><i class="bi bi-shield-shaded me-1"></i>${item.storageLocation}</div>
                <div class="text-muted mb-1"><i class="bi bi-geo-alt me-1"></i>${item.locationFound}</div>
                <div class="text-muted mb-3"><i class="bi bi-person-check me-1"></i><strong>${item.foundBy}</strong> (${item.dateFound})</div>

                <div class="d-flex justify-content-between align-items-center border-top pt-2">
                  <button onclick="handleEditFullFoundItem('${item.id}')" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                    <i class="bi bi-pencil-square me-1"></i> Edit Barang
                  </button>
                  <button onclick="handleDeleteFoundItem('${item.id}')" class="btn btn-sm btn-outline-danger rounded-pill px-2.5" title="Hapus Barang">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // CREATE: Catat Temuan Baru oleh Admin
    async function openCreateFoundItemModal() {
      const { value: formValues } = await Swal.fire({
        title: 'Catat Barang Temuan di Posko',
        width: '600px',
        html: `
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Nama Barang Temuan <span class="text-danger">*</span></label>
            <input id="swal-fnd-title" class="form-control form-control-sm" placeholder="Misal: Flashdisk SanDisk 32GB Hitam">
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6 text-start">
              <label class="form-label small fw-bold">Kategori Barang</label>
              <select id="swal-fnd-category" class="form-select form-select-sm">
                <option value="Elektronik & Gadget">Elektronik & Gadget</option>
                <option value="Dokumen & Kartu Identitas">Dokumen & Kartu Identitas</option>
                <option value="Tas & Dompet">Tas & Dompet</option>
                <option value="Kunci & Akses">Kunci & Akses</option>
                <option value="Botol Minum & Tumbler">Botol Minum & Tumbler</option>
                <option value="Pakaian & Aksesoris">Pakaian & Aksesoris</option>
                <option value="Alat Tulis & Buku">Alat Tulis & Buku</option>
                <option value="Lain-lain">Lain-lain</option>
              </select>
            </div>
            <div class="col-6 text-start">
              <label class="form-label small fw-bold">Warna Fisik</label>
              <input id="swal-fnd-color" class="form-control form-control-sm" placeholder="Misal: Hitam Merah">
            </div>
          </div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Lokasi Ditemukan (Gedung UMY) <span class="text-danger">*</span></label>
            <select id="swal-fnd-loc" class="form-select form-select-sm">
              <option value="Gedung AR. Fachruddin A (Perpustakaan & R. Sidang)">Gedung AR. Fachruddin A (Perpustakaan & R. Sidang)</option>
              <option value="Gedung AR. Fachruddin B (Lobby & R. Kuliah)">Gedung AR. Fachruddin B (Lobby & R. Kuliah)</option>
              <option value="Gedung Siti Walidah (F1/F2)">Gedung Siti Walidah (F1/F2)</option>
              <option value="Gedung Ki Bagus Hadikusumo (E1-E6)">Gedung Ki Bagus Hadikusumo (E1-E6)</option>
              <option value="Gedung Mas Mansyur (Kedokteran & Ilmu Kesehatan)">Gedung Mas Mansyur (Kedokteran & Ilmu Kesehatan)</option>
              <option value="Gedung Ibrahim (FTI / FEB / Lab Komputer)">Gedung Ibrahim (FTI / FEB / Lab Komputer)</option>
              <option value="Masjid KH Ahmad Dahlan (Lantai 1 / 2)">Masjid KH Ahmad Dahlan (Lantai 1 / 2)</option>
              <option value="Lapangan Bintang UMY">Lapangan Bintang UMY</option>
              <option value="Student Center UMY">Student Center UMY</option>
              <option value="Cafe 1912 / Kantin Barat UMY">Cafe 1912 / Kantin Barat UMY</option>
              <option value="Sportorium UMY">Sportorium UMY</option>
              <option value="Parkiran Gedung AR. Fachruddin">Parkiran Gedung AR. Fachruddin</option>
            </select>
          </div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Titik Simpan Posko Keamanan <span class="text-danger">*</span></label>
            <select id="swal-fnd-storage" class="form-select form-select-sm">
              <option value="Posko Keamanan Pusat (Gerbang Utama)">Posko Keamanan Pusat (Gerbang Utama)</option>
              <option value="Pos Satpam Gedung AR. Fachruddin A">Pos Satpam Gedung AR. Fachruddin A</option>
              <option value="Pos Satpam Gedung AR. Fachruddin B">Pos Satpam Gedung AR. Fachruddin B</option>
              <option value="Pos Satpam Gedung Siti Walidah">Pos Satpam Gedung Siti Walidah</option>
              <option value="Pos Satpam Gedung Ibrahim (FTI)">Pos Satpam Gedung Ibrahim (FTI)</option>
              <option value="Pos Satpam Gedung Mas Mansyur">Pos Satpam Gedung Mas Mansyur</option>
              <option value="Brankas Barang Berharga (Posko Pusat)">Brankas Barang Berharga (Posko Pusat)</option>
            </select>
          </div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Ciri Khusus / Keterangan</label>
            <textarea id="swal-fnd-features" class="form-control form-control-sm" rows="2" placeholder="Gantungan tali merah, lecet pemakaian, dll"></textarea>
          </div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Petugas Pencatat <span class="text-danger">*</span></label>
            <input id="swal-fnd-by" class="form-control form-control-sm" value="Petugas Posko UMY">
          </div>
          <div class="text-start mb-1">
            <label class="form-label small fw-bold">Foto Dokumentasi Fisik Barang (Upload / Kamera)</label>
            <div class="card p-2.5 bg-light border rounded-3">
              <input type="file" id="swal-fnd-file" class="form-control form-control-sm" accept=".png, .jpg, .jpeg, image/png, image/jpeg">
              <div id="swal-fnd-prev-box" class="mt-2 text-center" style="display: none;">
                <img id="swal-fnd-prev-img" src="" class="img-fluid rounded-3 border" style="max-height: 150px; object-fit: contain;">
                <div class="mt-1">
                  <button type="button" class="btn btn-xs btn-outline-danger rounded-pill px-2.5" onclick="clearSwalFoundImage()">
                    <i class="bi bi-trash me-1"></i> Hapus Foto
                  </button>
                </div>
              </div>
            </div>
            <small class="text-muted" style="font-size: 0.72rem;">Hanya menerima format <strong>PNG, JPG, atau JPEG</strong>. Unggah file atau gunakan kamera.</small>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Simpan ke Inventaris',
        cancelButtonText: 'Batal',
        didOpen: () => {
          modalUploadedFoundBase64 = '';
          const fileEl = document.getElementById('swal-fnd-file');
          if (fileEl) {
            fileEl.addEventListener('change', function (e) {
              const file = e.target.files[0];
              if (!file) return;

              const validMimes = ['image/png', 'image/jpeg', 'image/jpg'];
              const isValidExt = /\.(png|jpe?g)$/i.test(file.name || '');
              const isValidMime = validMimes.includes((file.type || '').toLowerCase());

              if (!isValidMime && !isValidExt) {
                showErrorAlert('Format File Tidak Sesuai', 'Foto barang wajib berformat PNG, JPG, atau JPEG.');
                clearSwalFoundImage();
                return;
              }

              const reader = new FileReader();
              reader.onload = function (ev) {
                modalUploadedFoundBase64 = ev.target.result;
                const prevImg = document.getElementById('swal-fnd-prev-img');
                const prevBox = document.getElementById('swal-fnd-prev-box');
                if (prevImg && prevBox) {
                  prevImg.src = modalUploadedFoundBase64;
                  prevBox.style.display = 'block';
                }
              };
              reader.readAsDataURL(file);
            });
          }
        },
        preConfirm: () => {
          const title = document.getElementById('swal-fnd-title').value.trim();
          if (!title) {
            Swal.showValidationMessage('Nama barang temuan wajib diisi');
            return false;
          }
          return {
            title,
            category: document.getElementById('swal-fnd-category').value,
            color: document.getElementById('swal-fnd-color').value.trim(),
            locationFound: document.getElementById('swal-fnd-loc').value,
            storageLocation: document.getElementById('swal-fnd-storage').value,
            features: document.getElementById('swal-fnd-features').value.trim(),
            foundBy: document.getElementById('swal-fnd-by').value.trim() || 'Petugas Posko',
            imageUrl: modalUploadedFoundBase64 || 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600',
            dateFound: new Date().toISOString().split('T')[0],
            timeFound: '12:00 WIB'
          };
        }
      });

      if (!formValues) return;

      try {
        const res = await api.createAdminFoundItem(formValues);
        if (res?.success) {
          await showSuccessAlert('Barang Dicatat!', `Barang ${res.data.id} berhasil ditambahkan ke inventaris posko.`, 1800);
          loadInventoryData();
        } else {
          showErrorAlert('Gagal Menyimpan', res?.message || 'Terjadi kesalahan.');
        }
      } catch (err) {
        showErrorAlert('Terjadi Kesalahan', 'Gagal terhubung ke backend.');
      }
    }

    function clearSwalFoundImage() {
      modalUploadedFoundBase64 = '';
      const fileInput = document.getElementById('swal-fnd-file');
      const prevBox = document.getElementById('swal-fnd-prev-box');
      const prevImg = document.getElementById('swal-fnd-prev-img');
      if (fileInput) fileInput.value = '';
      if (prevBox) prevBox.style.display = 'none';
      if (prevImg) prevImg.src = '';
    }

    // UPDATE: Edit Barang Temuan Lengkap
    async function handleEditFullFoundItem(id) {
      const item = allInventory.find(i => i.id === id);
      if (!item) return;

      let editModalFoundBase64 = item.imageUrl || '';

      const { value: formValues } = await Swal.fire({
        title: `Edit Inventaris (${id})`,
        width: '600px',
        html: `
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Nama Barang</label>
            <input id="swal-edit-inv-title" class="form-control form-control-sm" value="${item.title}">
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6 text-start">
              <label class="form-label small fw-bold">Kategori</label>
              <select id="swal-edit-inv-category" class="form-select form-select-sm">
                <option value="Elektronik & Gadget" ${item.category === 'Elektronik & Gadget' ? 'selected' : ''}>Elektronik & Gadget</option>
                <option value="Dokumen & Kartu Identitas" ${item.category === 'Dokumen & Kartu Identitas' ? 'selected' : ''}>Dokumen & Kartu Identitas</option>
                <option value="Tas & Dompet" ${item.category === 'Tas & Dompet' ? 'selected' : ''}>Tas & Dompet</option>
                <option value="Kunci & Akses" ${item.category === 'Kunci & Akses' ? 'selected' : ''}>Kunci & Akses</option>
                <option value="Botol Minum & Tumbler" ${item.category === 'Botol Minum & Tumbler' ? 'selected' : ''}>Botol Minum & Tumbler</option>
                <option value="Pakaian & Aksesoris" ${item.category === 'Pakaian & Aksesoris' ? 'selected' : ''}>Pakaian & Aksesoris</option>
                <option value="Alat Tulis & Buku" ${item.category === 'Alat Tulis & Buku' ? 'selected' : ''}>Alat Tulis & Buku</option>
                <option value="Lain-lain" ${item.category === 'Lain-lain' ? 'selected' : ''}>Lain-lain</option>
              </select>
            </div>
            <div class="col-6 text-start">
              <label class="form-label small fw-bold">Status Barang</label>
              <select id="swal-edit-inv-status" class="form-select form-select-sm">
                <option value="stored" ${item.status === 'stored' ? 'selected' : ''}>Tersimpan di Posko (Stored)</option>
                <option value="matched" ${item.status === 'matched' ? 'selected' : ''}>Matched (Menunggu Diambil)</option>
                <option value="returned" ${item.status === 'returned' ? 'selected' : ''}>Sudah Diserahkan (Returned)</option>
              </select>
            </div>
          </div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Titik Simpan Posko</label>
            <select id="swal-edit-inv-storage" class="form-select form-select-sm">
              <option value="Posko Keamanan Pusat (Gerbang Utama)" ${item.storageLocation.includes('Pusat') ? 'selected' : ''}>Posko Keamanan Pusat (Gerbang Utama)</option>
              <option value="Pos Satpam Gedung AR. Fachruddin A" ${item.storageLocation.includes('Fachruddin A') ? 'selected' : ''}>Pos Satpam Gedung AR. Fachruddin A</option>
              <option value="Pos Satpam Gedung AR. Fachruddin B" ${item.storageLocation.includes('Fachruddin B') ? 'selected' : ''}>Pos Satpam Gedung AR. Fachruddin B</option>
              <option value="Pos Satpam Gedung Siti Walidah" ${item.storageLocation.includes('Siti Walidah') ? 'selected' : ''}>Pos Satpam Gedung Siti Walidah</option>
              <option value="Pos Satpam Gedung Ibrahim (FTI)" ${item.storageLocation.includes('Ibrahim') ? 'selected' : ''}>Pos Satpam Gedung Ibrahim (FTI)</option>
              <option value="Pos Satpam Gedung Mas Mansyur" ${item.storageLocation.includes('Mas Mansyur') ? 'selected' : ''}>Pos Satpam Gedung Mas Mansyur</option>
              <option value="Brankas Barang Berharga (Posko Pusat)" ${item.storageLocation.includes('Brankas') ? 'selected' : ''}>Brankas Barang Berharga (Posko Pusat)</option>
            </select>
          </div>
          <div class="text-start mb-2">
            <label class="form-label small fw-bold">Ciri Khusus</label>
            <textarea id="swal-edit-inv-features" class="form-control form-control-sm" rows="2">${item.features}</textarea>
          </div>
          <div class="text-start mb-1">
            <label class="form-label small fw-bold">Ubah Foto Dokumentasi (Upload / Kamera)</label>
            <div class="card p-2.5 bg-light border rounded-3">
              <input type="file" id="swal-edit-fnd-file" class="form-control form-control-sm" accept=".png, .jpg, .jpeg, image/png, image/jpeg">
              <div id="swal-edit-fnd-prev-box" class="mt-2 text-center" style="${item.imageUrl ? '' : 'display: none;'}">
                <img id="swal-edit-fnd-prev-img" src="${item.imageUrl || ''}" class="img-fluid rounded-3 border" style="max-height: 140px; object-fit: contain;">
              </div>
            </div>
            <small class="text-muted" style="font-size: 0.72rem;">Hanya menerima format <strong>PNG, JPG, atau JPEG</strong>.</small>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Simpan Perubahan',
        cancelButtonText: 'Batal',
        didOpen: () => {
          const fileEl = document.getElementById('swal-edit-fnd-file');
          if (fileEl) {
            fileEl.addEventListener('change', function (e) {
              const file = e.target.files[0];
              if (!file) return;

              const validMimes = ['image/png', 'image/jpeg', 'image/jpg'];
              const isValidExt = /\.(png|jpe?g)$/i.test(file.name || '');
              const isValidMime = validMimes.includes((file.type || '').toLowerCase());

              if (!isValidMime && !isValidExt) {
                showErrorAlert('Format File Tidak Sesuai', 'Foto barang wajib berformat PNG, JPG, atau JPEG.');
                fileEl.value = '';
                return;
              }

              const reader = new FileReader();
              reader.onload = function (ev) {
                editModalFoundBase64 = ev.target.result;
                const prevImg = document.getElementById('swal-edit-fnd-prev-img');
                const prevBox = document.getElementById('swal-edit-fnd-prev-box');
                if (prevImg && prevBox) {
                  prevImg.src = editModalFoundBase64;
                  prevBox.style.display = 'block';
                }
              };
              reader.readAsDataURL(file);
            });
          }
        },
        preConfirm: () => {
          return {
            title: document.getElementById('swal-edit-inv-title').value.trim(),
            category: document.getElementById('swal-edit-inv-category').value,
            status: document.getElementById('swal-edit-inv-status').value,
            storageLocation: document.getElementById('swal-edit-inv-storage').value,
            features: document.getElementById('swal-edit-inv-features').value.trim(),
            imageUrl: editModalFoundBase64
          };
        }
      });

      if (!formValues) return;

      try {
        const res = await api.updateFoundItem(id, formValues);
        if (res?.success) {
          await showSuccessAlert('Inventaris Diperbarui!', `Data ${id} telah disimpan.`, 1800);
          loadInventoryData();
        } else {
          showErrorAlert('Gagal Memperbarui', res?.message || 'Terjadi kesalahan sistem.');
        }
      } catch (err) {
        showErrorAlert('Terjadi Kesalahan', 'Gagal terhubung ke backend.');
      }
    }

    // DELETE: Hapus Barang Posko
    async function handleDeleteFoundItem(id) {
      const confirm = await showConfirmDialog({
        title: 'Hapus Barang dari Posko?',
        text: `Apakah Anda yakin ingin menghapus barang ${id} dari inventaris posko?`,
        confirmButtonText: 'Ya, Hapus',
        cancelButtonText: 'Batal'
      });

      if (!confirm.isConfirmed) return;

      try {
        const res = await api.deleteFoundItem(id);
        if (res?.success) {
          await showSuccessAlert('Terhapus!', `Barang ${id} telah dihapus dari inventaris.`, 1800);
          loadInventoryData();
        } else {
          showErrorAlert('Gagal Menghapus', res?.message || 'Gagal menghapus barang.');
        }
      } catch (err) {
        showErrorAlert('Terjadi Kesalahan', 'Gagal terhubung ke server.');
      }
    }
  </script>
</body>

</html>
