<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Saya - Lost & Found UMY</title>

  <!-- Google Fonts, Bootstrap 5.3 & SweetAlert2 CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <!-- Guard: Wajib Login -->
  <script src="../js/auth.js"></script>
  <script>requireAuth(false);</script>
</head>

<body class="bg-light">

  <div id="navbar-container"></div>

  <main class="umy-main-content">
    <div class="container-fluid">
      <div class="card bg-dark text-white p-4 rounded-4 shadow-sm mb-4 border-0">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
          <div>
            <span class="badge bg-primary rounded-pill px-3 py-1.5 mb-2">
              <i class="bi bi-card-checklist me-1"></i> Riwayat Pelaporan Mahasiswa
            </span>
            <h3 class="fw-bold mb-1">Laporan Kehilangan Saya</h3>
            <p class="text-white opacity-75 small mb-0">Pantau status penanganan laporan, hasil verifikasi admin posko
              keamanan UMY, dan panduan klaim barang.</p>
          </div>
          <div class="d-flex gap-2">
            <a href="report-lost.html" class="btn btn-primary btn-sm rounded-pill px-3.5 py-2 fw-semibold shadow-sm">
              <i class="bi bi-plus-circle me-1"></i> Buat Laporan Baru
            </a>
          </div>
        </div>
      </div>

      <!-- DAFTAR LAPORAN PENGGUNA -->
      <div class="d-flex flex-column gap-3" id="my-reports-container">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm text-primary"></div> Memuat riwayat laporan...
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="telegram-modal-container"></div>

  <!-- Scripts JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('my-reports');
      renderFooter();
      loadMyReports();
    });

    async function loadMyReports() {
      const user = getCurrentUser();
      const container = document.getElementById('my-reports-container');

      try {
        const [lostRes, foundRes] = await Promise.all([
          api.getLostReports(),
          api.getFoundItems()
        ]);

        const allReports = lostRes?.data || [];
        const allFound = foundRes?.data || [];

        // Filter laporan milik user aktif
        const myReports = user?.role === 'admin'
          ? allReports
          : allReports.filter(r => (r.userId && r.userId === user?.id) || (r.reporterNim && r.reporterNim === user?.nim) || (user?.telegramUsername && r.reporterTelegram === user.telegramUsername));

        if (myReports.length === 0) {
          container.innerHTML = `
            <div class="card p-5 text-center border-0 shadow-sm rounded-4 text-muted">
              <i class="bi bi-inbox fs-1 mb-2"></i>
              <h5>Belum ada laporan kehilangan yang diajukan</h5>
              <p class="small mb-3">Kehilangan barang di kampus UMY? Buat laporan sekarang agar AI segera mencarinya di inventaris posko.</p>
              <a href="report-lost.html" class="btn btn-primary btn-sm rounded-pill px-4 mx-auto">+ Laporkan Barang</a>
            </div>
          `;
          return;
        }

        container.innerHTML = myReports.map(report => {
          const found = allFound.find(f => f.id === report.matchedItemId);

          return `
            <div class="card p-4 border-0 shadow-sm rounded-4 bg-white">
              <!-- Baris Atas -->
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-light text-dark font-monospace border">${report.id}</span>
                <span class="badge ${getStatusBadge(report.status)} px-3 py-1.5 rounded-pill">${formatStatus(report.status)}</span>
              </div>

              <h5 class="fw-bold mb-1 text-dark">${report.title}</h5>
              <p class="text-muted small fst-italic mb-3">"${report.features}"</p>

              <div class="row g-2 small text-secondary mb-3 border-top pt-2">
                <div class="col-sm-6"><i class="bi bi-geo-alt-fill text-danger me-1"></i><strong>${report.lastSeenLocation}</strong></div>
                <div class="col-sm-6"><i class="bi bi-calendar-event me-1"></i><strong>${report.dateLost} (${report.approxTime || 'WIB'})</strong></div>
              </div>

              <!-- Progress Langkah -->
              <div class="bg-light p-3 rounded-3 mb-3">
                <div class="row text-center small g-1">
                  <div class="col-3 fw-bold text-primary"><i class="bi bi-check-circle-fill"></i> 1. Dilaporkan</div>
                  <div class="col-3 ${report.status !== 'pending' ? 'fw-bold text-primary' : 'text-muted'}"><i class="bi ${report.status !== 'pending' ? 'bi-check-circle-fill' : 'bi-circle'}"></i> 2. AI Matched</div>
                  <div class="col-3 ${report.status === 'verified' || report.status === 'resolved' ? 'fw-bold text-success' : 'text-muted'}"><i class="bi ${report.status === 'verified' || report.status === 'resolved' ? 'bi-check-circle-fill' : 'bi-circle'}"></i> 3. Diverifikasi</div>
                  <div class="col-3 ${report.status === 'resolved' ? 'fw-bold text-dark' : 'text-muted'}"><i class="bi ${report.status === 'resolved' ? 'bi-check-circle-fill' : 'bi-circle'}"></i> 4. Selesai</div>
                </div>
              </div>

              <!-- Info Klaim jika Barang Cocok Ditemukan -->
              ${found ? `
                <div class="alert alert-info p-3 rounded-3 mb-0 d-flex justify-content-between align-items-center flex-wrap gap-3 border-info shadow-xs">
                  <div>
                    <strong class="text-dark">✨ Barang Cocok: ${found.title} (${report.matchScore}% Score)</strong>
                    <div class="small text-secondary mt-1"><i class="bi bi-geo-alt-fill text-primary me-1"></i> Lokasi Pengambilan: <strong>${found.storageLocation}</strong></div>
                    ${report.adminValidationNotes ? `<div class="small text-success mt-1 fw-semibold"><i class="bi bi-info-circle me-1"></i> Catatan Admin: "${report.adminValidationNotes}"</div>` : ''}
                  </div>
                  ${report.status === 'verified' ? `
                    <button onclick="handleClaim('${report.id}', '${found.id}')" class="btn btn-sm btn-success rounded-pill px-3.5 py-2 fw-semibold shadow-xs text-nowrap">
                      <i class="bi bi-check2-circle me-1"></i> Konfirmasi Barang Diterima
                    </button>
                  ` : report.status === 'resolved' ? `
                    <span class="badge bg-dark rounded-pill px-3 py-2"><i class="bi bi-bag-check me-1"></i> Barang Telah Diambil (Selesai)</span>
                  ` : `
                    <span class="badge bg-warning text-dark rounded-pill px-3 py-2"><i class="bi bi-hourglass-split me-1"></i> Menunggu Verifikasi Fisik</span>
                  `}
                </div>
              ` : `
                <div class="text-muted small fst-italic">
                  <i class="bi bi-info-circle me-1"></i> Sistem AI sedang memindai inventaris posko keamanan secara berkala.
                </div>
              `}
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loadMyReports:', err);
      }
    }

    function getStatusBadge(status) {
      if (status === 'resolved') return 'bg-dark';
      if (status === 'verified') return 'bg-success';
      if (status === 'ai_matched') return 'bg-warning text-dark';
      return 'bg-secondary';
    }

    function formatStatus(status) {
      if (status === 'resolved') return 'Selesai';
      if (status === 'verified') return 'Diverifikasi Posko';
      if (status === 'ai_matched') return 'AI Matched';
      return 'Menunggu';
    }

    async function handleClaim(lostReportId, foundItemId) {
      const confirm = await showConfirmDialog({
        title: 'Konfirmasi Pengambilan Barang',
        text: 'Apakah Anda telah menerima barang fisik tersebut dari petugas posko keamanan kampus?',
        confirmButtonText: 'Ya, Sudah Saya Terima',
        cancelButtonText: 'Batal'
      });

      if (!confirm.isConfirmed) return;

      try {
        const res = await api.completeClaim({ lostReportId, foundItemId });
        if (res?.success) {
          await showSuccessAlert('Klaim Berhasil!', 'Status laporan kini telah selesai. Terima kasih telah menggunakan Lost & Found AI.', 2500);
          loadMyReports();
        } else {
          showErrorAlert('Gagal Menyelesaikan', res?.message || 'Gagal mengubah status.');
        }
      } catch (err) {
        showErrorAlert('Terjadi Kesalahan', 'Gagal terhubung ke backend.');
      }
    }
  </script>
</body>

</html>
